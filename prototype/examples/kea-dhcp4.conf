// Minimal Kea DHCPv4 config for the HLVAR lab (/27 pool => 30 usable addresses, easy to exhaust)
{
"Dhcp4": {
  "interfaces-config": { "interfaces": [ "br-lab" ] },
  "control-socket": { "socket-type": "unix", "socket-name": "/run/kea/kea4-ctrl.sock" },
  "lease-database": { "type": "memfile", "persist": true, "lfc-interval": 3600 },
  "valid-lifetime": 3600,
  "hooks-libraries": [ { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_lease_cmds.so" } ],
  "subnet4": [ {
      "id": 1, "subnet": "10.99.0.0/27",
      "pools": [ { "pool": "10.99.0.2 - 10.99.0.30" } ],
      "option-data": [ { "name": "routers", "data": "10.99.0.1" } ]
  } ]
}
}
